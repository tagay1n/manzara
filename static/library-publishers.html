<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manzara</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
  <script src="/static/shell-state.js"></script>
  <link rel="stylesheet" href="/static/styles.css" />
  <link rel="stylesheet" href="/static/styles-console.css" />
  <script src="/static/lucide.js"></script>
</head>
<body class="console-body" data-manzara-page="library">
<main class="dashboard" data-page-content>
  <section class="runs-card publisher-curation-page publisher-workbench">
    <div class="publisher-page-head">
      <div class="classification-tabs" role="tablist" aria-label="Publisher views">
        <button id="tab-btn-directory" class="classification-tab active" role="tab" aria-controls="tab-panel-directory" aria-selected="true">Directory</button>
        <button id="tab-btn-review" class="classification-tab" role="tab" aria-controls="tab-panel-review" aria-selected="false" tabindex="-1">Review <span id="publisher-review-count" class="publisher-tab-count" hidden></span></button>
      </div>
      <p id="publisher-count" class="workflow-footnote"></p>
    </div>
    <div id="publisher-status" class="workflow-footnote" role="status"></div>
    <section id="tab-panel-directory" role="tabpanel" aria-labelledby="tab-btn-directory">
      <div id="publisher-directory-layout" class="publisher-directory-layout">
        <div class="publisher-directory-list">
          <div class="publisher-directory-toolbar">
            <div class="publisher-filter">
              <input id="publisher-filter-input" class="filter-input publisher-filter-input" type="search" placeholder="Search" autocomplete="off" aria-label="Search publishers and aliases" />
              <button id="publisher-filter-clear" class="publisher-filter-clear" type="button" aria-label="Clear search" hidden>×</button>
            </div>
            <div id="publisher-selection" class="publisher-header-actions" hidden>
              <span id="publisher-selected-count" class="workflow-footnote"></span>
              <button id="publisher-selection-clear" class="small-btn" type="button">Clear</button>
              <button id="publisher-merge" class="small-btn" type="button" disabled>Merge</button>
            </div>
          </div>
          <div id="publisher-table-status" class="workflow-footnote"></div>
          <div class="classification-table-wrap">
            <table class="classification-table publisher-review-table">
              <thead><tr>
                <th><input id="publisher-select-page" type="checkbox" aria-label="Select visible publishers" /></th>
                <th><button id="publisher-sort-name" class="publisher-sort" aria-label="Sort by publisher name">Publisher</button></th>
                <th><button id="publisher-sort-documents" class="publisher-sort" aria-label="Sort by document count">Documents</button></th>
                <th><span class="sr-only">Status</span></th>
              </tr></thead>
              <tbody id="publisher-table-body"></tbody>
            </table>
          </div>
          <div id="publisher-pager" class="publisher-pager" hidden>
            <span id="publisher-page-label" class="workflow-footnote"></span>
            <button id="publisher-page-previous" class="small-btn" type="button">Previous</button>
            <button id="publisher-page-next" class="small-btn" type="button">Next</button>
          </div>
        </div>
        <aside id="publisher-detail" class="publisher-detail" aria-label="Publisher details" hidden>
          <button id="publisher-detail-back" class="small-btn publisher-detail-back" type="button">Back</button>
          <div id="publisher-detail-body"></div>
        </aside>
      </div>
    </section>
    <section id="tab-panel-review" role="tabpanel" aria-labelledby="tab-btn-review" hidden>
      <div class="publisher-review-toolbar">
        <select id="publisher-cluster-filter" class="filter-input" aria-label="Suggestion category">
          <option value="cluster">Groups</option><option value="singleton">Single</option><option value="unresolved">Unresolved</option><option value="all">All</option>
        </select>
        <select id="publisher-review-status" class="filter-input" aria-label="Suggestion status">
          <option value="pending">Pending</option><option value="skipped">Skipped</option>
        </select>
        <details class="publisher-analysis"><summary>Analysis</summary><p id="publisher-clustering-coverage" class="workflow-footnote"></p></details>
      </div>
      <div id="publisher-suggestions-status" class="workflow-footnote" role="status"></div>
      <div id="publisher-review-layout" class="publisher-review-layout">
        <div id="publisher-suggestions-list" class="publisher-suggestions-list" aria-label="Publisher suggestions"></div>
        <section id="publisher-review-detail" class="publisher-review-detail" aria-label="Suggestion details" hidden>
          <button id="publisher-review-back" class="small-btn publisher-detail-back" type="button">Back</button>
          <div id="publisher-suggestions-body"></div>
        </section>
      </div>
    </section>
    <footer id="publisher-changes" class="publisher-changes" aria-label="Publisher changes" hidden>
      <span id="publisher-change-count" role="status"></span>
      <div class="publisher-header-actions">
        <button id="publisher-discard" class="small-btn" type="button" disabled>Discard</button>
        <button id="publisher-apply" class="small-btn publisher-primary" type="button" disabled>Apply changes</button>
      </div>
    </footer>
  </section>
</main>
<dialog id="publisher-merge-dialog" class="ui-dialog publisher-merge-dialog">
  <form id="publisher-merge-form" method="dialog">
    <header class="ui-dialog-head"><h3>Merge publishers</h3><button id="publisher-merge-close" class="icon-btn" value="cancel" aria-label="Close">×</button></header>
    <div class="publisher-merge-body">
      <label class="publisher-new-name">Name<input id="publisher-merge-name" class="filter-input" maxlength="240" required /></label>
      <div id="publisher-merge-selected" class="publisher-merge-selected"></div>
      <div class="publisher-filter publisher-merge-filter">
        <input id="publisher-merge-filter-input" class="filter-input publisher-filter-input" type="search" placeholder="Find existing name" aria-label="Search existing publisher names" autocomplete="off" />
        <button id="publisher-merge-filter-clear" class="publisher-filter-clear" type="button" aria-label="Clear name search" hidden>×</button>
      </div>
      <div id="publisher-merge-choices" class="publisher-merge-choices" hidden></div>
    </div>
    <footer class="publisher-dialog-actions"><button value="cancel" class="small-btn">Cancel</button><button id="publisher-merge-confirm" value="default" class="small-btn">Merge</button></footer>
  </form>
</dialog>
<script src="/static/sound-notifier.js"></script><script src="/static/core.js"></script><script src="/static/ui.js"></script><script src="/static/shell.js"></script><script src="/static/library-publishers.js"></script>
</body>
</html>
