<!doctype html>
<html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Manzara</title><link rel="icon" type="image/svg+xml" href="/static/favicon.svg" /><script src="/static/shell-state.js"></script><link rel="stylesheet" href="/static/styles.css" /><link rel="stylesheet" href="/static/styles-console.css" /><script src="/static/lucide.js"></script></head>
<body class="console-body" data-manzara-page="library"><main class="dashboard" data-page-content><section class="runs-card publisher-curation-page"><div class="library-overview-head publisher-overview-head"><p id="publisher-count" class="workflow-footnote"></p><div class="publisher-header-controls"><div class="publisher-filter"><input id="publisher-filter-input" class="filter-input publisher-filter-input" type="text" autocomplete="off" aria-label="Filter publishers" /><button id="publisher-filter-clear" class="publisher-filter-clear" type="button" aria-label="Clear publisher filter" hidden>×</button></div><div class="publisher-header-actions" aria-label="Publisher changes"><button id="publisher-merge" class="small-btn" disabled>Merge</button><button id="publisher-apply" class="small-btn" disabled>Apply changes</button><button id="publisher-discard" class="small-btn" disabled>Discard</button></div></div></div><div id="publisher-status" class="workflow-footnote"></div>
<div id="publisher-table-status" class="workflow-footnote"></div><div class="classification-table-wrap"><table class="classification-table publisher-review-table"><thead><tr><th><input id="publisher-select-page" type="checkbox" aria-label="Select visible publishers" /></th><th><button id="publisher-sort-name" class="publisher-sort" aria-label="Sort by publisher name">Publisher</button></th><th><button id="publisher-sort-documents" class="publisher-sort" aria-label="Sort by document count">Documents</button></th><th></th></tr></thead><tbody id="publisher-table-body"></tbody></table></div>
</section></main>
<dialog id="publisher-merge-dialog" class="ui-dialog publisher-merge-dialog"><form id="publisher-merge-form" method="dialog"><header class="ui-dialog-head"><h3>Merge publishers</h3><button id="publisher-merge-close" class="icon-btn" value="cancel" aria-label="Close">×</button></header><div class="publisher-merge-body"><label class="publisher-new-name">New canonical name<input id="publisher-merge-name" class="filter-input" maxlength="240" /></label><div id="publisher-merge-selected" class="publisher-merge-selected"></div><div class="publisher-filter publisher-merge-filter"><label for="publisher-merge-filter-input" class="sr-only">Filter canonical publishers</label><input id="publisher-merge-filter-input" class="filter-input publisher-filter-input" type="text" autocomplete="off" /><button id="publisher-merge-filter-clear" class="publisher-filter-clear" type="button" aria-label="Clear canonical publisher filter" hidden>×</button></div><div id="publisher-merge-choices" class="publisher-merge-choices" role="listbox" hidden></div></div><footer class="publisher-dialog-actions"><button value="cancel" class="small-btn">Cancel</button><button id="publisher-merge-confirm" value="default" class="small-btn">Merge</button></footer></form></dialog>
<script src="/static/sound-notifier.js"></script><script src="/static/core.js"></script><script src="/static/ui.js"></script><script src="/static/shell.js"></script><script src="/static/library-publishers.js"></script></body></html>
