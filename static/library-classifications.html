<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/styles-console.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="library">
    <main class="dashboard" data-page-content>
          <section class="runs-card">
            <div class="library-overview-head">
              <h2>Classifications</h2>
            </div>
            <div class="classification-tabs" role="tablist" aria-label="Classification views">
              <button id="tab-btn-table" class="classification-tab" data-tab="table" role="tab" aria-selected="false">
                Classification Table
              </button>
              <button id="tab-btn-tree" class="classification-tab active" data-tab="tree" role="tab" aria-selected="true">
                Hierarchy Tree
              </button>
              <button id="tab-btn-distribution" class="classification-tab" data-tab="distribution" role="tab" aria-selected="false">
                DDC Distribution
              </button>
            </div>

            <div id="tab-panel-table" class="classification-tab-panel" role="tabpanel" aria-labelledby="tab-btn-table">
              <div class="classification-filters">
                <input id="filter-search" class="filter-input" type="text" placeholder="Search ddc/path" />
                <input id="filter-ddc-prefix" class="filter-input" type="text" placeholder="DDC prefix" />
                <input id="filter-min-usage" class="filter-input" type="number" min="0" value="0" placeholder="Min usage" />
                <select id="filter-status" class="filter-select">
                  <option value="">Any status</option>
                  <option value="approved">approved</option>
                  <option value="pending">pending</option>
                  <option value="rejected">rejected</option>
                </select>
                <select id="filter-sort" class="filter-select">
                  <option value="usage_desc">Usage desc</option>
                  <option value="usage_asc">Usage asc</option>
                  <option value="ddc_asc">DDC asc</option>
                  <option value="ddc_desc">DDC desc</option>
                  <option value="created_desc">Created desc</option>
                  <option value="created_asc">Created asc</option>
                </select>
                <button id="filter-apply" class="small-btn">Apply</button>
              </div>
              <div id="classification-table-status" class="workflow-footnote">Loading table...</div>
              <div class="classification-table-wrap">
                <table class="classification-table">
                  <thead>
                    <tr>
                      <th>ID</th>
                      <th>DDC</th>
                      <th>Path</th>
                      <th>Usage</th>
                      <th>Status</th>
                      <th>Created By</th>
                      <th>Created At</th>
                    </tr>
                  </thead>
                  <tbody id="classification-table-body"></tbody>
                </table>
              </div>
              <div class="classification-pagination">
                <button id="page-prev" class="small-btn">Prev</button>
                <span id="page-label" class="workflow-footnote">Page 1 / 1</span>
                <button id="page-next" class="small-btn">Next</button>
              </div>
            </div>

            <div id="tab-panel-tree" class="classification-tab-panel active" role="tabpanel" aria-labelledby="tab-btn-tree">
              <div class="library-overview-head">
                <div>
                  <h2>Hierarchy Tree</h2>
                  <p class="workflow-footnote">Edit category levels or drag categories to move them. Drag a DDC classification onto another to merge.</p>
                </div>
                <div class="taxonomy-toolbar">
                  <button id="taxonomy-undo" class="small-btn" disabled>Undo</button>
                  <button id="taxonomy-redo" class="small-btn" disabled>Redo</button>
                  <button id="taxonomy-clear" class="small-btn" disabled>Clear</button>
                  <button id="taxonomy-review" class="small-btn primary" disabled>Review and apply</button>
                </div>
              </div>
              <div id="tree-status" class="workflow-footnote">Loading hierarchy...</div>
              <aside id="taxonomy-change-tray" class="taxonomy-change-tray" hidden></aside>
              <div id="tree-root" class="tree-root"></div>
            </div>

            <div id="tab-panel-distribution" class="classification-tab-panel" role="tabpanel" aria-labelledby="tab-btn-distribution">
              <h2>DDC Distribution</h2>
              <div id="distribution-root" class="distribution-root"></div>
            </div>

          </section>
        </main>

    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/library-classifications.js"></script>
  </body>
</html>
