<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="tasks">
    <main class="dashboard" data-page-content>
          <section class="runs-card">
            <div class="task-detail-head">
              <div>
                <h2 id="flow-title">Flow</h2>
                <div id="flow-subtitle" class="subtitle-lite">Flow details</div>
              </div>
              <div class="task-detail-actions">
                <a href="/tasks" class="small-btn task-back-link">All tasks</a>
              </div>
            </div>
            <div id="flow-stat-grid" class="stat-grid-compact"></div>
          </section>

          <section class="runs-card">
            <h2>Tasks</h2>
            <div id="flow-task-grid" class="flow-task-grid"></div>
          </section>

          <section id="shayan-catalog-card" class="runs-card shayan-catalog-card" hidden>
            <div class="task-detail-head">
              <div>
                <h2>Shayan Catalog</h2>
                <div id="shayan-catalog-subtitle" class="subtitle-lite">Programs and episodes</div>
              </div>
            </div>
            <div id="shayan-catalog-stats" class="stat-grid-compact"></div>
            <div id="shayan-program-list" class="shayan-program-list"></div>
          </section>
        </main>

    <dialog id="log-dialog" class="log-dialog">
      <div class="log-head">
        <h3 id="log-title">Run Logs</h3>
        <button id="close-logs" class="icon-btn" title="Close logs" aria-label="Close logs">
          <i data-lucide="x"></i>
        </button>
      </div>
      <pre id="log-content" class="log-content"></pre>
      <div class="log-controls">
        <button id="copy-logs" class="small-btn">Copy</button>
      </div>
    </dialog>

    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/flow.js"></script>
  </body>
</html>
