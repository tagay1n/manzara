<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="console-body">
    <div class="app-shell">
      <aside class="side-rail" aria-label="Primary">
        <a class="rail-brand" href="/dashboard" title="Manzara">
          <i data-lucide="sparkles"></i>
        </a>
        <nav class="rail-nav">
          <a href="/dashboard" class="rail-link" title="Dashboard">
            <i data-lucide="layout-grid"></i>
          </a>
          <a href="/schedules" class="rail-link" title="Schedules">
            <i data-lucide="calendar-range"></i>
          </a>
          <a href="/tasks" class="rail-link active" aria-current="page" title="Tasks">
            <i data-lucide="list-checks"></i>
          </a>
          <a href="/database" class="rail-link" title="Database">
            <i data-lucide="database"></i>
          </a>
          <a href="/library" class="rail-link" title="Library">
            <i data-lucide="book-open"></i>
          </a>
          <a href="/gemini" class="rail-link" title="Gemini">
            <i data-lucide="key-round"></i>
          </a>
        </nav>
      </aside>

      <div class="shell-main">
        <header class="topbar">
          <div class="topbar-left">
            <div class="brand-wrap">
              <div class="brand">Manzara</div>
              <div class="subtitle">Bird-eye view of Tatar content pipelines</div>
            </div>
            <label class="jump-box" aria-label="Jump">
              <i data-lucide="search"></i>
              <input type="text" placeholder="Jump to page, task, flow..." />
            </label>
          </div>
          <div class="top-controls">
            <div id="global-status" class="status-pill">Tasks: 0 • Flows: 0</div>
            <button
              id="stop-all-btn"
              class="icon-btn amber"
              title="Graceful stop all running tasks; press again to force stop"
              aria-label="Stop all tasks"
              disabled
            >
              <i data-lucide="square"></i>
            </button>
          </div>
        </header>

        <div class="alert-strip">
          <i data-lucide="activity"></i>
          <span>Run history is newest first. Select any run to inspect result and logs.</span>
        </div>

        <main class="dashboard">
          <section class="runs-card task-detail-card">
            <div class="task-detail-head">
              <div>
                <h2 id="task-title">Task</h2>
                <div id="task-subtitle" class="subtitle-lite">Task details</div>
              </div>
              <div class="task-detail-actions">
                <a href="/tasks" class="small-btn task-back-link">Back to tasks</a>
                <button id="task-toggle-btn" class="icon-btn task-detail-toggle" title="Start task" aria-label="Start task">
                  <i data-lucide="play"></i>
                </button>
              </div>
            </div>

            <div id="task-stat-grid" class="stat-grid-compact"></div>
          </section>

          <section class="task-detail-layout">
            <section class="runs-card">
              <h2>Run History</h2>
              <div id="task-run-list" class="task-run-list"></div>
            </section>

            <section class="runs-card">
              <h2>Run Result</h2>
              <div id="run-result" class="run-result">Select a run.</div>
            </section>
          </section>
        </main>

        <footer class="footer">
          <span>manzara v0.1.0</span>
          <span id="last-event">Last event: n/a</span>
        </footer>
      </div>
    </div>

    <dialog id="log-dialog" class="log-dialog">
      <div class="log-head">
        <h3 id="log-title">Run Logs</h3>
        <button id="close-logs" class="icon-btn" title="Close logs" aria-label="Close logs">
          <i data-lucide="x"></i>
        </button>
      </div>
      <pre id="log-content" class="log-content"></pre>
      <div class="log-controls">
        <button id="copy-logs" class="small-btn">Copy</button>
      </div>
    </dialog>

    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/task.js"></script>
  </body>
</html>
