<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="library">
    <main class="dashboard" data-page-content>
      <section class="runs-card collections-review-page cleanup-page">
        <div class="collections-review-head">
          <div>
            <h2>Document cleanup</h2>
            <p>Inspect executable storage plans and resolve ambiguous duplicate ISBNs.</p>
          </div>
          <div class="cleanup-task-links">
            <a class="small-btn" href="/tasks/library.prepare_document_cleanup">Prepare</a>
            <a class="small-btn" href="/tasks/maintenance.monocorpus_sync">Apply queue</a>
          </div>
        </div>
        <div id="cleanup-stat-grid" class="library-stat-grid collections-stat-grid"></div>
        <div class="collections-mode-tabs" role="tablist" aria-label="Cleanup views">
          <button class="small-btn is-active" data-cleanup-mode="queue" role="tab">Queue</button>
          <button class="small-btn" data-cleanup-mode="reviews" role="tab">ISBN review</button>
          <button class="small-btn" data-cleanup-mode="history" role="tab">History</button>
        </div>
        <div id="cleanup-status" class="workflow-footnote">Loading cleanup state...</div>
        <div id="cleanup-list" class="collections-review-list"></div>
      </section>
    </main>
    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/library-document-cleanup.js"></script>
  </body>
</html>
