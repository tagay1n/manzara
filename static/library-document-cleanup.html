<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/styles-console.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="library">
    <main class="dashboard" data-page-content>
      <section class="runs-card collections-review-page cleanup-page">
        <div class="collections-review-head">
          <div>
            <h2>ISBN conflict review</h2>
            <p>Compare documents that share one or more ISBNs and choose every copy that must remain.</p>
          </div>
          <div class="cleanup-task-links">
            <a class="small-btn" href="/tasks/library.prepare_document_cleanup">Scan for conflicts</a>
          </div>
        </div>
        <div id="cleanup-status" class="workflow-footnote">Loading ISBN conflicts...</div>
        <div id="cleanup-list" class="collections-review-list"></div>
        <details id="cleanup-recent" class="cleanup-recent" hidden>
          <summary>
            <span>Recently resolved</span>
            <span id="cleanup-recent-count" class="panel-pill">0</span>
          </summary>
          <div id="cleanup-recent-list" class="collections-review-list"></div>
        </details>
      </section>
    </main>
    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/library-document-cleanup.js"></script>
  </body>
</html>
