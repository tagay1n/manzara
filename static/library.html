<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="library">
    <main class="dashboard" data-page-content>
          <section class="runs-card">
            <div class="library-overview-head">
              <h2>Library Overview</h2>
            </div>
            <div id="library-status" class="workflow-footnote">Loading...</div>
            <div id="library-stat-grid" class="library-stat-grid"></div>
          </section>

          <section class="library-layout">
            <section class="runs-card">
              <h2>Top Classifications</h2>
              <div id="library-top-list" class="library-top-list"></div>
            </section>

            <section class="runs-card">
              <h2>Meta Evaluate</h2>
              <div id="library-last-run" class="library-last-run"></div>
            </section>
          </section>
        </main>

    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/library.js"></script>
  </body>
</html>
