<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="library">
    <main class="dashboard" data-page-content>
          <section class="runs-card">
            <div class="library-overview-head">
              <h2 id="classification-title">Classification</h2>
              <a href="/library/classifications" class="small-btn">Back to Classifications</a>
            </div>
            <div id="classification-status" class="workflow-footnote">Loading...</div>
            <div id="classification-stat-grid" class="library-stat-grid"></div>
          </section>

          <section class="library-layout">
            <section class="runs-card">
              <h2>Linked Documents</h2>
              <div class="classification-table-wrap">
                <table class="classification-table">
                  <thead>
                    <tr>
                      <th>MD5</th>
                      <th>Language</th>
                      <th>MIME</th>
                      <th>Path</th>
                    </tr>
                  </thead>
                  <tbody id="linked-docs-body"></tbody>
                </table>
              </div>
              <div class="classification-pagination">
                <button id="docs-prev" class="small-btn">Prev</button>
                <span id="docs-page-label" class="workflow-footnote">Page 1 / 1</span>
                <button id="docs-next" class="small-btn">Next</button>
              </div>
            </section>

            <section class="runs-card">
              <h2>Language Distribution</h2>
              <div id="language-root" class="distribution-root"></div>
            </section>
          </section>

          <section class="runs-card">
            <h2>Recent Meta Evaluate Runs</h2>
            <div id="meta-runs-root" class="runs-list"></div>
          </section>
        </main>

    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/library-classification.js"></script>
  </body>
</html>
