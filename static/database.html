<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="database">
    <main class="dashboard" data-page-content>
          <section class="runs-card">
            <div class="library-overview-head">
              <h2>Database State</h2>
              <span id="db-warning-pill" class="panel-pill">-</span>
            </div>
            <div id="db-status" class="workflow-footnote">Loading snapshot...</div>
            <div id="db-stat-grid" class="library-stat-grid"></div>
          </section>

          <section class="runs-card">
            <h2>Backup Status</h2>
            <div id="db-backup-grid" class="db-backup-grid"></div>
          </section>

          <section class="runs-card">
            <h2>Tables</h2>
            <div class="db-table-wrap">
              <table class="db-table">
                <thead>
                  <tr>
                    <th>Table</th>
                    <th>Est. Rows</th>
                    <th>Size</th>
                  </tr>
                </thead>
                <tbody id="db-table-body"></tbody>
              </table>
            </div>
            <div id="db-table-footnote" class="workflow-footnote">-</div>
          </section>
        </main>

    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/database.js"></script>
  </body>
</html>
