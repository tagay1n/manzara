<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/styles-console.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="tasks">
    <main class="dashboard" data-page-content>
          <section class="runs-card conveyor-card" aria-labelledby="conveyor-title">
            <div class="conveyor-head">
              <div>
                <h2 id="conveyor-title">Conveyor</h2>
                <div id="conveyor-status" class="workflow-footnote">Build one reusable task pipeline.</div>
              </div>
              <div class="conveyor-actions">
                <button id="conveyor-clear" class="small-btn quiet" type="button">Clear</button>
                <button id="conveyor-run" class="small-btn primary" type="button">Run</button>
                <button id="conveyor-stop" class="small-btn danger" type="button" hidden>Stop</button>
              </div>
            </div>
            <div class="conveyor-workspace">
              <div id="conveyor-stages" class="conveyor-stages" aria-label="Conveyor stages"></div>
            </div>
          </section>

          <section class="runs-card">
            <h2>Task Catalog</h2>
            <div id="task-flow-grid" class="task-flow-grid"></div>
          </section>
        </main>

    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/conveyor.js"></script>
    <script src="/static/tasks.js"></script>
  </body>
</html>
