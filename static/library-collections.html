<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="library">
    <main class="dashboard" data-page-content>
      <section class="runs-card collections-review-page">
        <div class="collections-review-head">
          <div>
            <h2>Collections</h2>
            <p>Review path-independent series proposals without changing approved collections automatically.</p>
          </div>
          <div id="collections-status" class="workflow-footnote">Loading overview...</div>
        </div>

        <div id="collections-stat-grid" class="library-stat-grid collections-stat-grid"></div>

        <div class="collections-mode-tabs" role="tablist" aria-label="Collection views">
          <button class="small-btn is-active" data-collection-mode="review_ready" role="tab">Needs review</button>
          <button class="small-btn" data-collection-mode="collections" role="tab">Collections</button>
          <button class="small-btn" data-collection-mode="ai_dismissed" role="tab">AI dismissed</button>
          <button class="small-btn" data-collection-mode="rejected" role="tab">History</button>
        </div>
        <div class="classification-filters collections-review-toolbar">
          <input id="filter-search" class="filter-input" type="search" placeholder="Find a collection" />
          <button id="filter-apply" class="small-btn">Apply</button>
        </div>

        <div id="collections-list-status" class="workflow-footnote">Loading candidates...</div>
        <div id="collections-list-root" class="collections-review-list"></div>
        <div class="classification-pagination">
          <button id="page-prev" class="small-btn">Prev</button>
          <span id="page-label" class="workflow-footnote">Page 1 / 1</span>
          <button id="page-next" class="small-btn">Next</button>
        </div>
      </section>
    </main>

    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/library-collections.js"></script>
  </body>
</html>
