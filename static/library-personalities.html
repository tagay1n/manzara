<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manzara</title><script src="/static/shell-state.js"></script><link rel="stylesheet" href="/static/styles.css"><link rel="stylesheet" href="/static/styles-console.css"><script src="/static/lucide.js"></script></head><body class="console-body" data-manzara-page="library"><main class="dashboard" data-page-content><section class="runs-card publisher-curation-page"><div class="library-overview-head publisher-overview-head"><p id="personality-count" class="workflow-footnote"></p><div class="publisher-header-controls"><div class="publisher-filter"><input id="personality-filter" class="filter-input publisher-filter-input" autocomplete="off" aria-label="Filter personalities"><button id="personality-clear" class="publisher-filter-clear" type="button" hidden>×</button></div><div class="publisher-header-actions"><button id="personality-merge" class="small-btn" disabled>Merge</button><button id="personality-apply" class="small-btn" disabled>Apply changes</button><button id="personality-discard" class="small-btn" disabled>Discard</button></div></div></div><div id="personality-status" class="workflow-footnote"></div><div class="classification-table-wrap"><table class="classification-table publisher-review-table"><thead><tr><th><input id="personality-all" type="checkbox"></th><th><button id="personality-sort-name" class="publisher-sort" aria-label="Sort by canonical name">Personality</button></th><th><button id="personality-sort-documents" class="publisher-sort" aria-label="Sort by document count">Documents</button></th></tr></thead><tbody id="personality-body"></tbody></table></div><section aria-labelledby="personality-decisions-heading"><h2 id="personality-decisions-heading">Normalization review</h2><p id="personality-decision-counts" class="workflow-footnote"></p><p class="workflow-footnote">Correct the source metadata before requesting a retry. A requested retry is processed by the next normalization run.</p><label>Status <select id="personality-decisions-state" class="filter-input"><option value="all">All outcomes</option><option value="not_person">Not a person</option><option value="unusable">Needs review</option><option value="failed">Failed</option><option value="deferred">Deferred</option><option value="retry_requested">Retry requested</option></select></label><div class="classification-table-wrap"><table class="classification-table"><thead><tr><th>Source name</th><th>Outcome and reason</th><th>Documents</th><th>Action</th></tr></thead><tbody id="personality-decisions-body"></tbody></table></div><div class="publisher-header-actions"><button id="personality-decisions-prev" class="small-btn" disabled>Previous</button><span id="personality-decisions-page" class="workflow-footnote"></span><button id="personality-decisions-next" class="small-btn" disabled>Next</button></div></section></section></main><dialog id="personality-merge-dialog" class="ui-dialog"><form id="personality-merge-form" method="dialog"><header class="ui-dialog-head"><h3>Merge personalities</h3></header><label>Canonical name<input id="personality-merge-name" class="filter-input" maxlength="240"></label><footer class="publisher-dialog-actions"><button value="cancel" class="small-btn">Cancel</button><button value="default" class="small-btn">Merge</button></footer></form></dialog><dialog id="personality-correct-dialog" class="ui-dialog"><form id="personality-correct-form" method="dialog"><header class="ui-dialog-head"><h3>Correct normalized details</h3></header><div class="publisher-merge-body personality-correction-grid"><label>Surname<input id="personality-surname" class="filter-input"></label><label>Surname initial<input id="personality-surname-initial" class="filter-input" maxlength="3"></label><label>Given name<input id="personality-name" class="filter-input"></label><label>Given-name initial<input id="personality-name-initial" class="filter-input" maxlength="3"></label><label>Father name<input id="personality-father-name" class="filter-input"></label><label>Father-name initial<input id="personality-father-name-initial" class="filter-input" maxlength="3"></label><label>Title<input id="personality-title" class="filter-input"></label><label>Sex<select id="personality-sex" class="filter-input"><option value="">Unknown</option><option value="M">M</option><option value="F">F</option></select></label></div><footer class="publisher-dialog-actions"><button value="cancel" class="small-btn">Cancel</button><button value="default" class="small-btn">Stage correction</button></footer></form></dialog><script src="/static/core.js"></script><script src="/static/ui.js"></script><script src="/static/shell.js"></script><script src="/static/library-personalities.js"></script></body></html>
