<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="stylesheet" href="/static/styles-console.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="library">
    <main class="dashboard" data-page-content>
          <section class="runs-card">
            <div class="library-overview-head">
              <h2>Personalities</h2>
              <div class="library-head-actions">
                <a href="/library/normalization/personality" class="small-btn">Normalization</a>
              </div>
            </div>
            <div id="personality-status" class="workflow-footnote">Loading personality overview...</div>
            <div id="personality-stat-grid" class="library-stat-grid"></div>
            <div id="personality-top-list" class="library-top-list"></div>

            <div class="classification-tabs" role="tablist" aria-label="Personality views">
              <button id="tab-btn-table" class="classification-tab active" data-tab="table" role="tab" aria-selected="true">
                Personality Table
              </button>
              <button id="tab-btn-scripts" class="classification-tab" data-tab="scripts" role="tab" aria-selected="false">
                Script Mix
                <span id="tab-badge-scripts" class="classification-tab-badge">0</span>
              </button>
              <button id="tab-btn-clusters" class="classification-tab" data-tab="clusters" role="tab" aria-selected="false">
                Variant Clusters
                <span id="tab-badge-clusters" class="classification-tab-badge">0</span>
              </button>
              <button id="tab-btn-queue" class="classification-tab" data-tab="queue" role="tab" aria-selected="false">
                Ambiguous Queue
                <span id="tab-badge-queue" class="classification-tab-badge">0</span>
              </button>
            </div>

            <div id="tab-panel-table" class="classification-tab-panel active" role="tabpanel" aria-labelledby="tab-btn-table">
              <div class="classification-filters personality-filters">
                <input id="filter-search" class="filter-input" type="text" placeholder="Search raw/normalized" />
                <select id="filter-script" class="filter-select">
                  <option value="">Any script</option>
                  <option value="cyrillic">cyrillic</option>
                  <option value="latin">latin</option>
                  <option value="mixed">mixed</option>
                  <option value="other">other</option>
                </select>
                <input id="filter-min-docs" class="filter-input" type="number" min="0" value="0" placeholder="Min docs" />
                <select id="filter-sort" class="filter-select">
                  <option value="docs_desc">Docs desc</option>
                  <option value="docs_asc">Docs asc</option>
                  <option value="mentions_desc">Mentions desc</option>
                  <option value="mentions_asc">Mentions asc</option>
                  <option value="name_asc">Name asc</option>
                  <option value="name_desc">Name desc</option>
                </select>
                <button id="filter-apply" class="small-btn">Apply</button>
              </div>
              <div id="personality-table-status" class="workflow-footnote">Loading table...</div>
              <div class="classification-table-wrap">
                <table class="classification-table">
                  <thead>
                    <tr>
                      <th>Raw Name</th>
                      <th>Normalized</th>
                      <th>Script</th>
                      <th>Docs</th>
                      <th>Mentions</th>
                      <th>Patronymic</th>
                    </tr>
                  </thead>
                  <tbody id="personality-table-body"></tbody>
                </table>
              </div>
              <div class="classification-pagination">
                <button id="page-prev" class="small-btn">Prev</button>
                <span id="page-label" class="workflow-footnote">Page 1 / 1</span>
                <button id="page-next" class="small-btn">Next</button>
              </div>
            </div>

            <div id="tab-panel-scripts" class="classification-tab-panel" role="tabpanel" aria-labelledby="tab-btn-scripts">
              <h2>Script Distribution</h2>
              <div id="scripts-root" class="distribution-root"></div>
            </div>

            <div id="tab-panel-clusters" class="classification-tab-panel" role="tabpanel" aria-labelledby="tab-btn-clusters">
              <h2>Variant Clusters</h2>
              <div id="clusters-root" class="duplicates-root"></div>
            </div>

            <div id="tab-panel-queue" class="classification-tab-panel" role="tabpanel" aria-labelledby="tab-btn-queue">
              <h2>Ambiguous Queue</h2>
              <div id="queue-root" class="unclassified-root"></div>
            </div>
          </section>
        </main>

    <script src="/static/sound-notifier.js"></script>
    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/library-entities.js"></script>
  </body>
</html>
