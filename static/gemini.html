<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
  </head>
  <body class="console-body">
    <div class="app-shell">
      <aside class="side-rail" aria-label="Primary">
        <a class="rail-brand" href="/tasks" title="Manzara">
          <i data-lucide="sparkles"></i>
        </a>
        <nav class="rail-nav">
          <a href="/schedules" class="rail-link" title="Schedules">
            <i data-lucide="calendar-range"></i>
          </a>
          <a href="/tasks" class="rail-link" title="Tasks">
            <i data-lucide="list-checks"></i>
          </a>
          <a href="/database" class="rail-link" title="Database">
            <i data-lucide="database"></i>
          </a>
          <a href="/library" class="rail-link" title="Library">
            <i data-lucide="book-open"></i>
          </a>
          <a href="/gemini" class="rail-link active" aria-current="page" title="Gemini">
            <i data-lucide="key-round"></i>
          </a>
        </nav>
      </aside>

      <div class="shell-main">
        <header class="topbar">
          <div class="topbar-left">
            <div class="brand-wrap">
              <div class="brand">Manzara</div>
              <div class="subtitle">Gemini keys runtime state</div>
            </div>
          </div>
          <div class="top-controls">
            <div id="global-status" class="status-pill">Keys: 0 • Accounts: 0</div>
            <button id="reset-all-btn" class="small-btn" title="Reset exhausted status for all keys">
              Reset all exhausted
            </button>
          </div>
        </header>

        <main class="dashboard">
          <section class="runs-card">
            <h2>Gemini Runtime</h2>
            <div id="gemini-status" class="workflow-footnote">Loading...</div>
            <div id="gemini-stat-grid" class="stat-grid-compact"></div>
          </section>

          <section class="runs-card">
            <h2>Accounts + Keys</h2>
            <div id="gemini-accounts" class="gemini-accounts"></div>
          </section>
        </main>

        <footer class="footer">
          <span>manzara v0.1.0</span>
          <span id="last-event">Last event: n/a</span>
        </footer>
      </div>
    </div>

    <script src="/static/core.js"></script>
    <script src="/static/gemini.js"></script>
  </body>
</html>
