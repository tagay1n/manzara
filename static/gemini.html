<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manzara</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg" />
    <script src="/static/shell-state.js"></script>
    <link rel="stylesheet" href="/static/styles.css" />
    <script src="/static/lucide.js"></script>
  </head>
  <body class="console-body" data-manzara-page="gemini">
    <main class="dashboard" data-page-content>
          <section class="runs-card">
            <div class="library-overview-head">
              <h2>Gemini Runtime</h2>
              <div class="library-head-actions">
                <button id="override-blackout-btn" class="small-btn state-attention" title="Allow Gemini requests during the current blackout" hidden>
                  End blackout
                </button>
                <button id="reset-all-btn" class="small-btn" title="Reset exhausted status for all keys">
                  Reset exhausted
                </button>
              </div>
            </div>
            <div id="gemini-status" class="workflow-footnote">Loading...</div>
            <div id="gemini-stat-grid" class="stat-grid-compact"></div>
          </section>

          <section class="runs-card">
            <div class="gemini-section-head">
              <div>
                <h2>Model capacity</h2>
                <p>Percentage of configured keys exhausted in the current Gemini cycle.</p>
              </div>
            </div>
            <div id="gemini-model-usage" class="gemini-model-usage"></div>
          </section>

          <section class="runs-card">
            <div class="gemini-section-head">
              <div>
                <h2>Accounts and keys</h2>
                <p>Compact key status. Expand an account only when you need it.</p>
              </div>
            </div>
            <div id="gemini-accounts" class="gemini-accounts"></div>
          </section>
        </main>

    <script src="/static/core.js"></script>
    <script src="/static/ui.js"></script>
    <script src="/static/shell.js"></script>
    <script src="/static/gemini.js"></script>
  </body>
</html>
