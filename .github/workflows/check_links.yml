# Job to run links availability checker script

name: Run links availability checker

on:
  schedule:
    - cron: '52 15 * * *'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      MANZARA_CONFIG_PATH: ${{ runner.temp }}/manzara/private/config.yaml
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.x'
      - name: Install dependencies
        shell: bash
        run: |
          mapfile -t packages < <(
            sed -n -E '/^(mistletoe|beautifulsoup4|requests|pyyaml)==/p' requirements.txt
          )
          test "${#packages[@]}" -eq 4
          python -m pip install "${packages[@]}"
      - name: Prepare private runtime configuration
        env:
          MANZARA_CONFIG_BASE64: ${{ secrets.MANZARA_LINK_CHECKER_CONFIG_BASE64 }}
        run: python scripts/prepare_workflow_config.py
      - name: Call script
        run: python .github/links-health-checker/main.py
      - name: Remove private configuration
        if: always()
        run: rm -rf "${{ runner.temp }}/manzara/private"
      - name: Prepare creds
        run: |
          git config user.email "no-reply@github.com"
          git config user.name "Broken links checker bot"
      - name: Delete branch if there are no broken links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f broken-links.txt || 
          git push origin -d broken-links ||
          exit 0
      - name: Create commit and push if there are broken links
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -f broken-links.txt || exit 0
          git branch -f broken-links && 
          git checkout broken-links && 
          git add broken-links.txt && 
          git commit -m "Found broken links" && 
          git push -f origin broken-links && 
          echo "Found broken links" &&
          exit 1
