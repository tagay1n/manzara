name: 'Aiven PostgreSQL backup'

on:
  schedule:
    # GitHub cron is UTC. This is 04:27 Europe/Moscow and avoids the busy hour boundary.
    - cron: '27 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-postgres-logical-backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MANZARA_CONFIG_PATH: ${{ runner.temp }}/manzara/private/config.yaml
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install backup dependencies
        shell: bash
        run: |
          mapfile -t packages < <(
            sed -n -E '/^(boto3|pyyaml)==/p' requirements.txt
          )
          test "${#packages[@]}" -eq 2
          python -m pip install "${packages[@]}"

      - name: Prepare private runtime configuration
        env:
          MANZARA_CONFIG_BASE64: ${{ secrets.MANZARA_BACKUP_CONFIG_BASE64 }}
        run: python scripts/prepare_workflow_config.py

      - name: Create and upload logical backup
        run: python scripts/backup_postgres_to_b2.py

      - name: Remove private configuration
        if: always()
        run: rm -rf "${{ runner.temp }}/manzara/private"
