name: 'Nightly Google Sheets & Drive Export'

on:
  schedule:
    # GitHub cron is UTC. This is 03:07 Europe/Moscow and avoids the busy hour boundary.
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-google-catalog-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      MANZARA_DATABASE_URL: ${{ secrets.MANZARA_DATABASE_URL }}
      MANZARA_DB_POOL_SIZE: '1'
      MANZARA_DB_SCHEMA: monocorpus
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install export dependencies
        shell: bash
        run: |
          mapfile -t packages < <(
            sed -n -E '/^(gspread|google-api-python-client|google-auth-oauthlib|psycopg2-binary|pyyaml|sqlalchemy)==/p' requirements.txt
          )
          test "${#packages[@]}" -eq 6
          python -m pip install "${packages[@]}"

      - name: Prepare Google OAuth credentials
        shell: bash
        env:
          GOOGLE_OAUTH_TOKEN_JSON_BASE64: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_BASE64 }}
          MANZARA_ARTIFACTS_ROOT: ${{ runner.temp }}/manzara
        run: |
          test -n "$MANZARA_DATABASE_URL"
          test -n "$GOOGLE_OAUTH_TOKEN_JSON_BASE64"
          case "$MANZARA_DATABASE_URL" in
            postgres://*|postgresql://*|postgresql+psycopg://*|postgresql+psycopg2://*) ;;
            *)
              echo "::error::MANZARA_DATABASE_URL must start with postgres:// or postgresql://"
              exit 1
              ;;
          esac
          credentials_dir="$MANZARA_ARTIFACTS_ROOT/private/credentials/google-drive"
          install -d -m 700 "$credentials_dir"
          printf '%s' "$GOOGLE_OAUTH_TOKEN_JSON_BASE64" \
            | base64 --decode > "$credentials_dir/personal_token.json"
          chmod 600 "$credentials_dir/personal_token.json"

      - name: Export catalog to Google Drive and Sheets
        env:
          MANZARA_ARTIFACTS_ROOT: ${{ runner.temp }}/manzara
        run: python -m app.modules.maintenance.runtime.dump_state
