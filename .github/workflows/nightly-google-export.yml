name: 'Google Sheets export'

on:
  schedule:
    # GitHub cron is UTC. This is 03:07 Europe/Moscow and avoids the busy hour boundary.
    - cron: '7 0 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly-google-catalog-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Initialize runtime paths
        shell: bash
        run: |
          printf '%s\n' \
            "MANZARA_CONFIG_PATH=$RUNNER_TEMP/manzara/private/config.yaml" \
            >> "$GITHUB_ENV"

      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install export dependencies
        shell: bash
        run: |
          mapfile -t packages < <(
            sed -n -E '/^(gspread|google-auth-oauthlib|psycopg2-binary|pyyaml|sqlalchemy)==/p' requirements.txt
          )
          test "${#packages[@]}" -eq 5
          python -m pip install "${packages[@]}"

      - name: Prepare private runtime configuration
        env:
          MANZARA_DATABASE_URL: ${{ secrets.MANZARA_DATABASE_URL }}
          MANZARA_AIVEN_CA_CERT_BASE64: ${{ secrets.MANZARA_AIVEN_CA_CERT_BASE64 }}
        run: python scripts/prepare_workflow_config.py export

      - name: Prepare Google OAuth credentials
        shell: bash
        env:
          GOOGLE_OAUTH_TOKEN_JSON_BASE64: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON_BASE64 }}
        run: |
          test -n "$GOOGLE_OAUTH_TOKEN_JSON_BASE64"
          credentials_dir="$(python -c 'from app.artifacts import private_credentials_dir; print(private_credentials_dir("google-drive"))')"
          install -d -m 700 "$credentials_dir"
          printf '%s' "$GOOGLE_OAUTH_TOKEN_JSON_BASE64" \
            | base64 --decode > "$credentials_dir/personal_token.json"
          chmod 600 "$credentials_dir/personal_token.json"

      # Validate the same remote database snapshot that will be exported.
      - name: Validate sharing and publish catalog to Google Sheets
        run: python -m app.modules.maintenance.runtime.dump_state --validate-sharing

      - name: Remove private configuration
        if: always()
        run: rm -rf "$RUNNER_TEMP/manzara/private"
